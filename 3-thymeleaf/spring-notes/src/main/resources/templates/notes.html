<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>

<h1>Notes</h1>

<p th:if="${notes.isEmpty()}">No notes yet. Write the first one!</p>

<ul th:unless="${notes.isEmpty()}">
    <li th:each="note : ${notes}">
        <a th:href="@{/notes/{id}(id=${note.id})}" th:text="${note.text}">Example note</a>
        <small th:text="${#temporals.format(note.created, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</small>
    </li>
</ul>

<h2>New note</h2>
<form th:action="@{/notes}" method="post">
    <input name="text" placeholder="What's on your mind?" required>
    <button type="submit">Save</button>
</form>
</body>
</html>
